name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # The package is a Windows executable, and the settings screen test runs only on Windows.
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          # The full history is needed to check that the tag points to a commit on main.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Check that the tag is on main
        shell: pwsh
        run: |
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) { throw "Tag $env:GITHUB_REF_NAME does not point to a commit on main." }
      - name: Format, build, analyze, and test
        shell: pwsh
        run: ./scripts/check.ps1
      - name: Build the package
        shell: pwsh
        # build-package.ps1 rejects a version that does not look like 1.2.3 or 1.2.3-beta.1.
        run: ./scripts/build-package.ps1 -Version ($env:GITHUB_REF_NAME.Substring(1))
      - uses: actions/upload-artifact@v7
        with:
          name: package
          path: artifacts/OyasumiGray.Windows-win-x64.zip
          if-no-files-found: error
          # The release job attaches the ZIP to the release right after this job.
          retention-days: 1

  release:
    # Only this job can write to the repository, and it runs no repository code.
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: package
      - name: Create a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # A re-run must not add a second draft for the same tag.
          existing=$(gh release list --limit 100 --json tagName --jq "map(select(.tagName == \"$GITHUB_REF_NAME\")) | length")
          if [ "$existing" -ne 0 ]; then
            echo "A release for $GITHUB_REF_NAME already exists. Delete it on the Releases page before running again." >&2
            exit 1
          fi
          prerelease=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" OyasumiGray.Windows-win-x64.zip \
            --draft --verify-tag --generate-notes "${prerelease[@]}" \
            --title "おやすみグレー for Windows $GITHUB_REF_NAME"
