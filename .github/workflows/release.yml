name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    # The package is a Windows executable, and the settings screen test runs only on Windows.
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          # The full history is needed to check that the tag points to a commit on main.
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Check the tag
        id: tag
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ($tag -notmatch '^v(?<version>\d+\.\d+\.\d+(-[0-9A-Za-z.]+)?)$') {
              throw "Tag $tag must look like v1.2.3 or v1.2.3-beta.1."
          }
          $version = $Matches.version
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) { throw "Tag $tag does not point to a commit on main." }
          "version=$version" >> $env:GITHUB_OUTPUT
          "prerelease=$($tag.Contains('-'))".ToLowerInvariant() >> $env:GITHUB_OUTPUT
      - name: Format, build, analyze, and test
        shell: pwsh
        run: ./scripts/check.ps1
      - name: Build the package
        shell: pwsh
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: ./scripts/build-package.ps1 -Version $env:VERSION
      - name: Create a draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ steps.tag.outputs.prerelease }}
        run: |
          $arguments = @(
              'release', 'create', $env:GITHUB_REF_NAME, 'artifacts/OyasumiGray.Windows-win-x64.zip',
              '--draft', '--verify-tag', '--generate-notes', '--title', "おやすみグレー for Windows $env:GITHUB_REF_NAME"
          )
          if ($env:PRERELEASE -eq 'true') { $arguments += '--prerelease' }
          gh @arguments
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed with exit code $LASTEXITCODE" }
