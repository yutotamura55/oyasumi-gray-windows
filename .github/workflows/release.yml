name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    # The package is a Windows executable, and the settings screen test runs only on Windows.
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      # Needed only by the last step. The ZIP is not uploaded as an Actions artifact,
      # because anyone can download artifacts of a public repository before the release is published.
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # The full history is needed to check that the tag points to a commit on main.
          fetch-depth: 0
          # Keep the write token out of .git/config while repository code runs.
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Check that the tag is on main
        shell: pwsh
        run: |
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) { throw "Tag $env:GITHUB_REF_NAME does not point to a commit on main." }
      - name: Format, build, analyze, and test
        shell: pwsh
        run: ./scripts/check.ps1
      - name: Build the package
        shell: pwsh
        # build-package.ps1 rejects a version that does not look like 1.2.3 or 1.2.3-beta.1.
        run: ./scripts/build-package.ps1 -Version ($env:GITHUB_REF_NAME.Substring(1))
      - name: Create a draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A re-run must not add a second draft for the same tag.
          $tags = @(gh release list --limit 100 --json tagName --jq '.[].tagName')
          if ($LASTEXITCODE -ne 0) { throw "gh release list failed with exit code $LASTEXITCODE" }
          if ($tags -ccontains $env:GITHUB_REF_NAME) {
              throw "A release for $env:GITHUB_REF_NAME already exists. Delete it on the Releases page before running again."
          }
          $arguments = @(
              'release', 'create', $env:GITHUB_REF_NAME, 'artifacts/OyasumiGray.Windows-win-x64.zip',
              '--draft', '--verify-tag', '--generate-notes', '--title', "おやすみグレー for Windows $env:GITHUB_REF_NAME"
          )
          if ($env:GITHUB_REF_NAME.Contains('-')) { $arguments += '--prerelease' }
          gh @arguments
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed with exit code $LASTEXITCODE" }
